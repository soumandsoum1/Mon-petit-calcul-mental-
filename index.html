<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Petit Calcul</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🧮 Mon Petit Calcul</h1>
        <p>Apprendre les maths en s'amusant !</p>
    </header>

    <main>
        <h2>Choisis ton opération</h2>

        <div class="operations">
            <button onclick="jouer('+')">➕ Addition</button>
            <button onclick="jouer('-')">➖ Soustraction</button>
            <button onclick="jouer('*')">✖️ Multiplication</button>
            <button onclick="jouer('/')">➗ Division</button>
        </div>

        <section id="jeu">
            <h2>Bienvenue !</h2>
            <p>Choisis une opération pour commencer.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
